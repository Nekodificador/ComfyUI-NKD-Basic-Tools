[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "comfyui-nkd-basic-tools"
version = "1.12.0"
description = "Everyday utility nodes for ComfyUI: inpaint crop & stitch, hand-drawn vector masks, path and field blur, mask painting and cleanup, colour grading, gradients, noise and grain — each with a live preview in the node."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/Nekodificador/ComfyUI-NKD-Basic-Tools"

[tool.comfy]
PublisherId = "nekodificador"
DisplayName = "NKD Basic Tools"
Icon = ""
